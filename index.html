<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EgoTierlist</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
</head>
<body>
  <header>
    <h1>EgoTierlist</h1>
    <nav id="gamemode-buttons"></nav>
  </header>

  <main>
    <section id="tiers">
      <!-- Tiers -->
      <div class="tier" id="HT1"><h2>HT1</h2><div class="items" id="HT1-items"></div></div>
      <div class="tier" id="LT1"><h2>LT1</h2><div class="items" id="LT1-items"></div></div>
      <div class="tier" id="HT2"><h2>HT2</h2><div class="items" id="HT2-items"></div></div>
      <div class="tier" id="LT2"><h2>LT2</h2><div class="items" id="LT2-items"></div></div>
      <div class="tier" id="HT3"><h2>HT3</h2><div class="items" id="HT3-items"></div></div>
      <div class="tier" id="LT3"><h2>LT3</h2><div class="items" id="LT3-items"></div></div>
      <div class="tier" id="HT4"><h2>HT4</h2><div class="items" id="HT4-items"></div></div>
      <div class="tier" id="LT4"><h2>LT4</h2><div class="items" id="LT4-items"></div></div>
      <div class="tier" id="HT5"><h2>HT5</h2><div class="items" id="HT5-items"></div></div>
      <div class="tier" id="LT5"><h2>LT5</h2><div class="items" id="LT5-items"></div></div>
    </section>

    <section id="player-input">
      <input type="text" id="new-item" placeholder="Player Name">
      <input type="number" id="new-points" placeholder="Points">
      <button onclick="addItem()">Add Player</button>
      <button onclick="saveTierList()">Save Current Mode</button>
      <button onclick="loadTierList()">Load Current Mode</button>
    </section>
<button onclick="testFirebase()">Test Firebase</button>
    <footer>
      <div id="extras">
        <!-- Discord link / share buttons will go here -->
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
